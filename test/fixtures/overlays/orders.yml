purpose: >
  Order header. One row per checkout.
rules:
  - Never delete; cancel via status
columns:
  total:
    formula: "SUM(order_items.qty * order_items.price)"
  channel:
    meaning: Sales channel the order came through.
    values:
      WEB: Online storefront
      POS: In-store point of sale
      PARTNER: Third-party partner integration
  status:
    enum:
      pending: awaiting payment confirmation
      shipped: handed to courier
      cancelled: user or system cancelled
